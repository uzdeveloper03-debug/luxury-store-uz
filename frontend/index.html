<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Luxury Store UZ</title>
  <link rel="stylesheet" href="/css/style.css?v=9">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="header">
    <div class="logo">LUXURY<span> STORE</span></div>
    <button class="language" id="language">RU / UZ</button>
  </header>

  <main>
    <section class="hero cinematic-hero">
      <div class="cinematic-scene" id="cinematic-scene">
        <div class="cinematic-image-wrap">
          <img id="cinematic-image" class="cinematic-image" alt="Коллекция Luxury Store UZ">
        </div>

        <div class="cinematic-overlay"></div>

        <div class="cinematic-content">
          <p class="hero-label">LUXURY STORE UZ / EXCLUSIVE SELECTION</p>
          <h1>YOUR STYLE.<br>YOUR RULES.</h1>
          <p class="hero-description">Стиль, который не нуждается в словах.</p>

          <div class="cinematic-bottom">
            <button class="hero-button" onclick="showCatalog()">МАГАЗИН</button>
            <span id="cinematic-counter">LUXURY / 01</span>
          </div>
        </div>
      </div>
    </section>

    <section class="categories">
      <div class="section-heading">
        <span>КАТЕГОРИИ</span>
        <span class="muted">01 / 02</span>
      </div>
      <div id="categories" class="category-list">
        <p class="muted">Загрузка категорий...</p>
      </div>
    </section>

    <section class="products">
      <div class="section-heading">
        <span>ВСЯ ОБУВЬ</span>
        <span class="muted">FULL COLLECTION</span>
      </div>
      <div class="product-search">
        <input
          id="product-search-input"
          type="search"
          placeholder="Поиск по названию, бренду..."
          autocomplete="off"
          aria-label="Поиск товаров"
        >
        <button id="product-search-clear" type="button" aria-label="Очистить поиск">×</button>
      </div>
      <div id="products" class="product-grid">
        <p class="muted">Загрузка товаров...</p>
      </div>
    </section>

    <section id="user-view" class="user-view" hidden></section>
  </main>

  <nav class="bottom-nav">
    <button class="active" data-page="home" onclick="showHome()">Главная</button>
    <button data-page="catalog" onclick="showCatalog()">Каталог</button>
    <button data-page="cart" onclick="showCart()">Корзина</button>
    <button data-page="profile" onclick="showProfile()">Профиль</button>
  </nav>

  <script src="/js/app.js?v=9"></script>
</body>
</html>
